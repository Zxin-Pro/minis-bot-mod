plugins {
    id 'java-library'
}

base {
    archivesName = "minis-bot-mod"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        url = "https://maven.neoforged.net/releases/"
    }
}

dependencies {
    implementation "net.neoforged:neoforge:21.1.112"
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
            "Specification-Title": "minis-bot-mod",
            "Specification-Version": "1",
            "Implementation-Title": "Minis Bot Mod",
            "Implementation-Version": "1.0.0"
        ])
    }
}
